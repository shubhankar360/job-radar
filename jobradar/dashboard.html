<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>job-radar</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --ink: #17181c; --mute: #62656e; --line: #e2e2dc;
  --acc: #1f6f5c; --acc-soft: #e3f1ec; --warn: #9a5b00; --warn-soft: #fbf0dc; --bad: #a33a2b; --bad-soft: #f8e3df;
  --chip: #efefea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121315; --panel: #1a1b1f; --ink: #ececea; --mute: #9a9ca3; --line: #2b2d33;
    --acc: #5cc4a6; --acc-soft: #183a31; --warn: #e2a94a; --warn-soft: #3a2c14; --bad: #ef8a7a; --bad-soft: #3d1f1a; --chip: #24262b; }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
.sub { color: var(--mute); font-size: 13px; }
nav { display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--line); }
nav button { background: none; border: 0; padding: 10px 12px; font: inherit; color: var(--mute); cursor: pointer; border-bottom: 2px solid transparent; }
nav button[aria-selected=true] { color: var(--ink); border-color: var(--acc); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 24px; align-items: center; }
.filters input, .filters select { font: inherit; padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); }
.filters input[type=search] { min-width: 220px; flex: 1 1 220px; max-width: 360px; }
.filters label { color: var(--mute); font-size: 13px; display: flex; gap: 6px; align-items: center; }
main { padding: 0 24px 40px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 52px 1fr auto; gap: 4px 14px; align-items: start; }
.score { font-weight: 700; font-size: 18px; text-align: center; padding-top: 2px; font-variant-numeric: tabular-nums; }
.score small { display: block; font-size: 10px; font-weight: 500; color: var(--mute); letter-spacing: .3px; }
.t { font-weight: 600; }
.t a { color: inherit; text-decoration: none; }
.t a:hover { text-decoration: underline; }
.co { color: var(--mute); }
.meta { color: var(--mute); font-size: 12.5px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--ink); }
.chip.ok { background: var(--acc-soft); color: var(--acc); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.actions { display: flex; flex-direction: column; gap: 5px; align-items: stretch; min-width: 108px; }
.btn { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; text-decoration: none; text-align: center; white-space: nowrap; }
.btn.primary { background: var(--acc); border-color: var(--acc); color: #fff; }
@media (prefers-color-scheme: dark) { .btn.primary { color: #0d1f1a; } }
.btn:focus-visible, nav button:focus-visible, summary:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
details { grid-column: 2 / 4; font-size: 12.5px; color: var(--mute); }
details summary { cursor: pointer; width: max-content; }
details ul { margin: 6px 0 0; padding-left: 18px; }
.status { font-size: 11.5px; font-weight: 600; color: var(--acc); text-transform: uppercase; letter-spacing: .4px; }
table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
th { color: var(--mute); font-weight: 600; font-size: 12px; }
.empty { color: var(--mute); padding: 30px 0; text-align: center; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
@media (max-width: 640px) {
  header, nav, .filters, main { padding-left: 16px; padding-right: 16px; }
  .card { grid-template-columns: 42px 1fr; }
  .actions { grid-column: 1 / 3; flex-direction: row; flex-wrap: wrap; }
  details { grid-column: 1 / 3; }
  .tracker-wrap { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <h1>job-radar</h1>
  <span class="sub" id="sub"></span>
</header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-tab="queue">Ranked queue</button>
  <button role="tab" aria-selected="false" data-tab="tracker">Applications</button>
</nav>
<section id="queue">
  <div class="filters">
    <input type="search" id="q" placeholder="Filter by company, title, skill…" aria-label="Filter">
    <select id="arch" aria-label="Role family"><option value="">All role families</option></select>
    <select id="elig" aria-label="Eligibility"><option value="">Any eligibility</option><option value="yes">Confirmed open to you</option><option value="likely">Likely</option><option value="relocate">Relocation / visa</option></select>
    <select id="kind" aria-label="Type"><option value="">Any type</option><option value="full-time">Full-time</option><option value="contract">Contract</option><option value="internship">Internship</option></select>
    <label><input type="checkbox" id="paid"> Salary listed</label>
    <label><input type="checkbox" id="hideApplied" checked> Hide applied</label>
  </div>
  <main id="list"></main>
</section>
<section id="tracker" hidden>
  <main><div class="tracker-wrap" id="trackerTable"></div></main>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = /*__DATA__*/null;
const served = location.protocol.startsWith("http");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtUsd = (n) => n ? "$" + (n >= 1000 ? Math.round(n / 1000) + "k" : n) : "";

$("#sub").textContent = `${DATA.rows.length} ranked · ${DATA.excluded} filtered out (not eligible, off-target or applied) · updated ${new Date(DATA.generated).toLocaleString()}`;
[...new Set(DATA.rows.map((r) => r.arch))].sort().forEach((a) => $("#arch").insertAdjacentHTML("beforeend", `<option>${esc(a)}</option>`));

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 3200); }

async function setStatus(r, status) {
  if (!served) {
    navigator.clipboard?.writeText(`python -m jobradar status "${r.uid}" ${status}`);
    toast(`Copied: python -m jobradar status "${r.uid}" ${status}`);
    return;
  }
  const res = await fetch("/api/status", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ uid: r.uid, key: r.key, company: r.company, title: r.title, status }) });
  if (res.ok) { r.status = status; toast(`${r.company}: ${status}`); render(); } else toast("Could not save: " + res.status);
}

function card(r) {
  const flags = r.flags.map((f) => `<span class="chip ${/ban|repost|open \d|below/.test(f) ? "bad" : "warn"}">${esc(f)}</span>`).join("");
  const elig = `<span class="chip ${r.verdict === "yes" ? "ok" : "warn"}" title="${esc(r.why_ok)}">${esc(r.verdict === "yes" ? "open to you" : r.verdict)}</span>`;
  const pay = r.usd ? `<span class="chip ok">${fmtUsd(r.usd)}/yr</span>` : "";
  const skills = r.matched.slice(0, 5).map((m) => `<span class="chip">${esc(m)}</span>`).join("");
  const gaps = r.gaps.length ? `<span class="chip warn" title="Asked for, not on your profile">gaps: ${esc(r.gaps.slice(0, 3).join(", "))}</span>` : "";
  const cv = r.folder ? `<a class="btn" href="${esc(r.folder)}/cv.pdf" target="_blank" rel="noopener">Tailored CV</a><a class="btn" href="${esc(r.folder)}/answers.md" target="_blank" rel="noopener">Answers</a>` : "";
  return `<article class="card">
    <div class="score">${Math.round(r.score)}<small>SCORE</small></div>
    <div>
      <div class="t"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a> <span class="co">· ${esc(r.company)}</span> ${r.status ? `<span class="status">${esc(r.status)}</span>` : ""}</div>
      <div class="meta">${esc(r.location)} · ${esc(r.arch)} · ${esc(r.level)}${r.years ? ` · ${r.years}+ yrs` : ""}${r.type ? " · " + esc(r.type) : ""} · ${r.age}d ago · via ${esc(r.source)}</div>
      <div class="chips">${elig}${pay}${skills}${gaps}${flags}</div>
    </div>
    <div class="actions">
      <a class="btn primary" href="${esc(r.apply)}" target="_blank" rel="noopener">Apply ↗</a>
      ${cv}
      <button class="btn" data-act="applied">Mark applied</button>
      <button class="btn" data-act="skipped">Skip</button>
    </div>
    <details><summary>Why this score</summary><ul>${r.reasons.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>
  </article>`;
}

function render() {
  const q = $("#q").value.toLowerCase(), arch = $("#arch").value, elig = $("#elig").value, kind = $("#kind").value;
  const rows = DATA.rows.filter((r) =>
    (!q || (r.company + " " + r.title + " " + r.matched.join(" ") + " " + r.location).toLowerCase().includes(q)) &&
    (!arch || r.arch === arch) && (!elig || r.verdict === elig) && (!kind || r.type === kind) &&
    (!$("#paid").checked || r.usd) && (!$("#hideApplied").checked || !r.status || r.status === "queued"));
  const list = $("#list");
  list.innerHTML = rows.length ? rows.map(card).join("") : `<p class="empty">Nothing matches these filters.</p>`;
  list.querySelectorAll(".card").forEach((el, i) => el.querySelectorAll("[data-act]").forEach((b) =>
    b.addEventListener("click", () => setStatus(rows[i], b.dataset.act))));
}

function renderTracker() {
  const t = DATA.tracker;
  $("#trackerTable").innerHTML = t.length ? `<table><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Applied</th><th>Updated</th><th>Notes</th></tr></thead><tbody>${
    t.map((a) => `<tr><td>${esc(a.company)}</td><td>${a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a>` : esc(a.title)}</td><td>${esc(a.status)}</td><td>${esc((a.applied_at || "").slice(0, 10))}</td><td>${esc((a.updated_at || "").slice(0, 10))}</td><td>${esc(a.notes || "")}</td></tr>`).join("")
  }</tbody></table>` : `<p class="empty">No applications logged yet.</p>`;
}

document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("nav button").forEach((x) => x.setAttribute("aria-selected", x === b));
  $("#queue").hidden = b.dataset.tab !== "queue"; $("#tracker").hidden = b.dataset.tab !== "tracker";
}));
["#q", "#arch", "#elig", "#kind", "#paid", "#hideApplied"].forEach((s) => $(s).addEventListener("input", render));
render(); renderTracker();
</script>
</body>
</html>
